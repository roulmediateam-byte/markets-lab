[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "asx-shorts"            # check the name is free on pypi.org first
version = "0.1.0"
description = "Download and tidy ASIC daily short position reports for ASX stocks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas", "requests"]
authors = [{name = "Adam Lam"}]
license = {text = "MIT"}
[tool.hatch.build.targets.wheel]
packages = ["asx_shorts/src/asx_shorts"]
