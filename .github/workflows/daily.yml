# Every weekday 08:00 UTC (7 pm Sydney in summer, 6 pm in winter).
# build  -> runs trackers, uploads datasets (no approval needed), saves drafts
# publish -> WAITS for you to tap "Approve and deploy" (environment "publish"), then posts everywhere
# pages  -> deploys the website
name: daily
on:
  schedule: [{cron: "0 8 * * 1-5"}]
  workflow_dispatch:
    inputs:
      demo: {description: "Use demo data (1) or live data (0)", default: "0"}
concurrency: daily
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEMO: ${{ github.event.inputs.demo || '0' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}   # newer Kaggle tokens use this name
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pip install -r requirements.txt
      - run: python build_all.py
      - run: python sync_data.py
        continue-on-error: true
      - name: Save data (forward-test log, tracker state)
        run: |
          git config user.name "markets-lab-bot"; git config user.email "markets-lab-bot@users.noreply.github.com"
          git add data && git commit -m "Data $(date -u +%F)" && git pull --rebase && git push || echo "no data change"
      - uses: actions/upload-artifact@v4
        with: {name: drafts, path: "out/\nsite/", retention-days: 7}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: publish          # <- the approve button (Settings > Environments > publish > Required reviewers)
    env:
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: git pull
      - uses: actions/download-artifact@v4
        with: {name: drafts, path: .}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python publish_all.py
      - name: Commit website
        run: |
          git config user.name "markets-lab-bot"; git config user.email "markets-lab-bot@users.noreply.github.com"
          git add site && git commit -m "Publish $(date -u +%F)" && git pull --rebase && git push || echo "no site change"
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  pages:
    needs: publish
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
